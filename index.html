<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Link-Laboratory</title>
    <style>
        :root { --neon: #ff2d55; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Courier New', monospace; margin: 0; overflow-x: hidden; text-align: center; }
        .lab-title { padding: 40px; color: var(--neon); text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); }
        .viewport { width: 100%; overflow: hidden; padding: 50px 0; min-height: 450px; }
        .track { display: flex; gap: 20px; width: max-content; animation: scroll 60s linear infinite; padding: 0 20px; }
        .card { width: 250px; background: #111; border: 1px solid #333; padding: 10px; transition: 0.3s; }
        .card img { width: 100%; height: 320px; object-fit: cover; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .add-btn { background: none; border: 1px solid var(--neon); color: var(--neon); padding: 15px 30px; cursor: pointer; margin-bottom: 50px; }
        #upload-form { display: none; background: #0a0a0a; padding: 25px; border: 1px solid var(--neon); width: 320px; margin: 0 auto 50px; }
        input { width: 90%; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>

<h1 class="lab-title">M-Link-Laboratory</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button class="add-btn" onclick="toggleForm()">+ OPEN UPLOAD TERMINAL</button>

<div id="upload-form">
    <input type="file" id="fileInput" accept="image/*">
    <input type="text" id="captionInput" placeholder="DATA DESCRIPTION...">
    <button onclick="uploadToGithub()" id="saveBtn" style="background:var(--neon); color:white; border:none; padding:10px; width:100%; cursor:pointer;">EXECUTE COMMIT</button>
</div>

<script>
    const CONFIG = {
        token: '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', 
        repo: 'AntonMoryakov/M-Link-Laboratory',
        branch: 'main'
    };

    async function loadMemories() {
        const track = document.getElementById('track');
        try {
            // Используем официальный API для получения файла, чтобы избежать проблем с CORS
            const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/memories.json?ref=${CONFIG.branch}`, {
                headers: { 'Authorization': `token ${CONFIG.token}` }
            });
            
            if (!res.ok) throw new Error(`Status: ${res.status}`);
            
            const fileData = await res.json();
            const data = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
            
            if (!data || data.length === 0) {
                track.innerHTML = '<p style="color:#444">[ DATABASE_EMPTY ]</p>';
                return;
            }

            track.innerHTML = '';
            const displayData = data.length < 5 ? [...data, ...data, ...data] : data;

            displayData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // Проксируем через jsdelivr для скорости
                const proxyUrl = item.url.replace('raw.githubusercontent.com', 'cdn.jsdelivr.net/gh').replace('/main/', '@main/');
                card.innerHTML = `
                    <img src="${proxyUrl}?t=${Date.now()}" onerror="this.src='https://via.placeholder.com/250x320?text=LOADING...'">
                    <div style="margin-top:12px; font-size:11px; color: #888; text-align: left;">
                        <span style="color: var(--neon)">[${item.date}]</span><br>${item.caption || ''}
                    </div>
                `;
                track.appendChild(card);
            });
        } catch (e) { 
            console.error("FULL ERROR:", e);
            track.innerHTML = `<p style="color:white; background:red; padding:5px;">ERR: ${e.message}</p>`;
        }
    }

    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        const caption = document.getElementById('captionInput').value;
        const btn = document.getElementById('saveBtn');
        if (!fileInput.files[0]) return alert("Файл не выбран!");
        
        btn.disabled = true;
        btn.innerText = "UPLOADING...";

        const file = fileInput.files[0];
        const fileName = `img/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1];
            try {
                // 1. Загрузка фото
                await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Upload ${fileName}`, content, branch: CONFIG.branch })
                });

                // 2. Обновление JSON
                const jsonRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/memories.json?ref=${CONFIG.branch}`, {
                    headers: { 'Authorization': `token ${CONFIG.token}` }
                });
                const jsonData = await jsonRes.json();
                const memories = JSON.parse(decodeURIComponent(escape(atob(jsonData.content))));
                
                memories.push({
                    url: `https://raw.githubusercontent.com/${CONFIG.repo}/${CONFIG.branch}/${fileName}`,
                    caption: caption,
                    date: new Date().toLocaleDateString('ru-RU')
                });

                await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/memories.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update DB",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(memories, null, 2)))),
                        sha: jsonData.sha,
                        branch: CONFIG.branch
                    })
                });

                alert("СИСТЕМА ОБНОВЛЕНА");
                location.reload();
            } catch (err) {
                alert("ERROR: " + err.message);
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(file);
    }

    function toggleForm() {
        const form = document.getElementById('upload-form');
        form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    loadMemories();
</script>
</body>
</html>
