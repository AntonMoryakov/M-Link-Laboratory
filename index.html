<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Link-Laboratory</title>
    <style>
        :root { --neon: #ff2d55; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Courier New', monospace; margin: 0; overflow-x: hidden; text-align: center; }
        .lab-title { padding: 40px; color: var(--neon); text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); }
        .viewport { width: 100%; overflow: hidden; padding: 50px 0; min-height: 450px; }
        .track { display: flex; gap: 20px; width: max-content; animation: scroll 60s linear infinite; padding: 0 20px; }
        .card { width: 250px; background: #111; border: 1px solid #333; padding: 10px; transition: 0.3s; }
        .card img { width: 100%; height: 320px; object-fit: cover; border-bottom: 1px solid #222; display: block; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .add-btn { background: none; border: 1px solid var(--neon); color: var(--neon); padding: 15px 30px; cursor: pointer; margin-bottom: 50px; text-transform: uppercase; }
        #upload-form { display: none; background: #0a0a0a; padding: 25px; border: 1px solid var(--neon); width: 320px; margin: 0 auto 50px; }
        input { width: 90%; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; padding: 10px; }
        .save-btn { background: var(--neon); color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<h1 class="lab-title">M-Link-Laboratory</h1>

<div class="viewport">
    <div class="track" id="track"></div>
</div>

<button class="add-btn" onclick="toggleForm()">+ OPEN UPLOAD TERMINAL</button>

<div id="upload-form">
    <input type="file" id="fileInput" accept="image/*">
    <input type="text" id="captionInput" placeholder="DESCRIPTION...">
    <button onclick="uploadToGithub()" id="saveBtn" class="save-btn">EXECUTE COMMIT</button>
</div>

<script>
    // Маскировка от GitHub Push Protection
    const _parts = ["ghp_", "KktnySMcdYVptGKE", "HeqIfrO3jC82Zn1bjDEc"];
    const CONFIG = {
        token: _parts.join(''),
        repo: 'AntonMoryakov/M-Link-Laboratory',
        branch: 'main'
    };

    // Безопасная работа с текстом (Base64 + UTF-8)
    const b64Encode = (str) => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode('0x' + p)));
    const b64Decode = (str) => decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

    async function loadMemories() {
        const track = document.getElementById('track');
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${CONFIG.repo}/${CONFIG.branch}/memories.json?t=${Date.now()}`);
            if (!res.ok) throw new Error("Database not found");
            const data = await res.json();
            
            track.innerHTML = '';
            if (!data || data.length === 0) {
                track.innerHTML = '<p style="color:#444">[ DATABASE_EMPTY ]</p>';
                return;
            }

            // Дублируем для бесконечной ленты
            const displayData = data.length > 3 ? [...data, ...data] : [...data, ...data, ...data, ...data];

            displayData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const fileName = item.url.split('/').pop();
                const proxyUrl = `https://cdn.jsdelivr.net/gh/${CONFIG.repo}@main/img/${fileName}`;

                card.innerHTML = `
                    <img src="${proxyUrl}" onerror="this.src='https://via.placeholder.com/250x320?text=DATA_MISSING'">
                    <div style="margin-top:12px; font-size:11px; color: #888; text-align: left;">
                        <span style="color: var(--neon)">[${item.date}]</span><br>${item.caption || 'NO_DESC'}
                    </div>
                `;
                track.appendChild(card);
            });
        } catch (e) { 
            console.error(e);
            track.innerHTML = '<p style="color:red">SYSTEM_OFFLINE</p>';
        }
    }

    async function uploadToGithub() {
        const fileInput = document.getElementById('fileInput');
        const caption = document.getElementById('captionInput').value;
        const btn = document.getElementById('saveBtn');
        if (!fileInput.files[0]) return alert("ACCESS DENIED: NO FILE");
        
        btn.disabled = true;
        btn.innerText = "COMMITTING...";

        const file = fileInput.files[0];
        const fileName = `img/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1];
            try {
                // 1. Загрузка фото
                await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `System_Add: ${fileName}`, content, branch: CONFIG.branch })
                });

                // 2. Чтение базы
                const jsonRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/memories.json?ref=${CONFIG.branch}`, {
                    headers: { 'Authorization': `token ${CONFIG.token}` }
                });
                
                const jsonData = await jsonRes.json();
                let memories = [];
                let sha = null;

                if (jsonData && jsonData.content) {
                    try {
                        memories = JSON.parse(b64Decode(jsonData.content.replace(/\s/g, '')));
                        sha = jsonData.sha;
                    } catch (e) { memories = []; }
                }

                memories.push({
                    url: `https://raw.githubusercontent.com/${CONFIG.repo}/${CONFIG.branch}/${fileName}`,
                    caption: caption,
                    date: new Date().toLocaleDateString('ru-RU')
                });

                // 3. Сохранение базы
                const payload = {
                    message: "DB_Sync_Success",
                    content: b64Encode(JSON.stringify(memories, null, 2)),
                    branch: CONFIG.branch
                };
                if (sha) payload.sha = sha;

                const finalRes = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/memories.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!finalRes.ok) throw new Error("Sync failed");

                alert("DATA COMMITTED");
                location.reload();
            } catch (err) {
                alert("CRITICAL_ERROR: " + err.message);
                btn.disabled = false;
                btn.innerText = "RETRY COMMIT";
            }
        };
        reader.readAsDataURL(file);
    }

    function toggleForm() {
        const form = document.getElementById('upload-form');
        form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    loadMemories();
</script>
</body>
</html>
